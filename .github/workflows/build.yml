name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

# Default permissions - minimal
permissions:
  contents: read

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
            args: "--target aarch64-apple-darwin"
            adb_source: "adb-macos"
            cache_key: "macos-arm64"
          - platform: "macos-latest"
            target: "x86_64-apple-darwin"
            args: "--target x86_64-apple-darwin"
            adb_source: "adb-macos"
            cache_key: "macos-x64"
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            args: ""
            adb_source: "adb-windows"
            cache_key: "windows-x64"

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write # Only needed for tauri-action to create release on tags
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install CMake (macOS)
        if: matrix.platform == 'macos-latest'
        run: brew install cmake || brew upgrade cmake || true

      - name: Install CMake (Windows)
        if: matrix.platform == 'windows-latest'
        uses: lukka/get-cmake@v3.31.6

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          cache-on-failure: true
          shared-key: ${{ matrix.cache_key }}

      - name: Copy platform ADB (Unix)
        if: matrix.platform != 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/resources/adb
          cp src-tauri/resources/${{ matrix.adb_source }}/* src-tauri/resources/adb/
          chmod +x src-tauri/resources/adb/adb

      - name: Copy platform ADB (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/resources/adb
          cp src-tauri/resources/${{ matrix.adb_source }}/* src-tauri/resources/adb/

      - name: Install dependencies
        run: npm ci

      # Release build with signing (tags only)
      - name: Build Tauri app (release)
        if: startsWith(github.ref, 'refs/tags/')
        id: tauri-release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Pico Live Assistant ${{ github.ref_name }}"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # Cache-warming build without signing (main only)
      - name: Build Tauri app (cache warming)
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Upload artifacts for publish job
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.cache_key }}
          path: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.app.tar.gz
            src-tauri/target/**/release/bundle/**/*.app.tar.gz.sig
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.msi.sig
          if-no-files-found: error # Fail if artifacts missing

  publish-to-public:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: read # Only needs read; writes to external repo via token
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: List and verify artifacts
        shell: bash
        run: |
          set -euo pipefail
          echo "=== All artifacts ==="
          find artifacts -type f -name "Pico*" | sort

          # Verify expected artifacts exist
          echo "=== Verifying artifacts ==="
          AARCH64_TAR=$(find artifacts -path "*aarch64*" -name "*.app.tar.gz" | head -1)
          X64_TAR=$(find artifacts -path "*x86_64*" -name "*.app.tar.gz" | head -1)
          WIN_EXE=$(find artifacts -name "*setup.exe" | head -1)

          if [ -z "$AARCH64_TAR" ]; then echo "ERROR: Missing aarch64 app bundle"; exit 1; fi
          if [ -z "$X64_TAR" ]; then echo "ERROR: Missing x64 app bundle"; exit 1; fi
          if [ -z "$WIN_EXE" ]; then echo "ERROR: Missing Windows exe"; exit 1; fi

          echo "All required artifacts found"

      - name: Rename artifacts with architecture
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"

          # Rename aarch64 app bundle
          AARCH64_TAR=$(find artifacts -path "*aarch64*" -name "*.app.tar.gz" | head -1)
          AARCH64_SIG=$(find artifacts -path "*aarch64*" -name "*.app.tar.gz.sig" | head -1)
          if [ -n "$AARCH64_TAR" ]; then
            mv "$AARCH64_TAR" "artifacts/Pico.Live.Assistant_${VERSION}_aarch64.app.tar.gz"
          fi
          if [ -n "$AARCH64_SIG" ]; then
            mv "$AARCH64_SIG" "artifacts/Pico.Live.Assistant_${VERSION}_aarch64.app.tar.gz.sig"
          fi

          # Rename x86_64 app bundle
          X64_TAR=$(find artifacts -path "*x86_64*" -name "*.app.tar.gz" | head -1)
          X64_SIG=$(find artifacts -path "*x86_64*" -name "*.app.tar.gz.sig" | head -1)
          if [ -n "$X64_TAR" ]; then
            mv "$X64_TAR" "artifacts/Pico.Live.Assistant_${VERSION}_x64.app.tar.gz"
          fi
          if [ -n "$X64_SIG" ]; then
            mv "$X64_SIG" "artifacts/Pico.Live.Assistant_${VERSION}_x64.app.tar.gz.sig"
          fi

          echo "=== Renamed artifacts ==="
          find artifacts -type f -name "Pico*" | sort

      - name: Create latest.json for updater
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"

          # Read signatures
          AARCH64_SIG=$(cat "artifacts/Pico.Live.Assistant_${VERSION}_aarch64.app.tar.gz.sig" 2>/dev/null || echo '')
          X64_SIG=$(cat "artifacts/Pico.Live.Assistant_${VERSION}_x64.app.tar.gz.sig" 2>/dev/null || echo '')
          MSI_SIG=$(cat artifacts/**/Pico*.msi.sig 2>/dev/null | head -1 || echo '')

          cat > latest.json << EOF
          {
            "version": "${VERSION}",
            "notes": "See the assets to download this version and install.",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": {
                "signature": "${AARCH64_SIG}",
                "url": "https://github.com/wbai0/pico-releases/releases/download/${{ github.ref_name }}/Pico.Live.Assistant_${VERSION}_aarch64.app.tar.gz"
              },
              "darwin-x86_64": {
                "signature": "${X64_SIG}",
                "url": "https://github.com/wbai0/pico-releases/releases/download/${{ github.ref_name }}/Pico.Live.Assistant_${VERSION}_x64.app.tar.gz"
              },
              "windows-x86_64": {
                "signature": "${MSI_SIG}",
                "url": "https://github.com/wbai0/pico-releases/releases/download/${{ github.ref_name }}/Pico.Live.Assistant_${VERSION}_x64-setup.exe"
              }
            }
          }
          EOF

          echo "=== latest.json ==="
          cat latest.json

      - name: Publish to public releases repo
        uses: softprops/action-gh-release@v2
        with:
          repository: wbai0/pico-releases
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: "Pico Live Assistant ${{ github.ref_name }}"
          body: "See the assets to download this version and install."
          files: |
            latest.json
            artifacts/**/*.dmg
            artifacts/**/*.app.tar.gz
            artifacts/**/*.app.tar.gz.sig
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.msi.sig
